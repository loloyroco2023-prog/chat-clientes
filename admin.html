<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Chat - Clientes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    height: 100vh;
  }
  #lista-conversaciones {
    width: 280px;
    background: white;
    border-right: 1px solid #ddd;
    overflow-y: auto;
  }
  #lista-conversaciones h2 {
    font-size: 16px;
    padding: 16px;
    margin: 0;
    border-bottom: 1px solid #eee;
  }
  .item-conversacion {
    padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
  }
  .item-conversacion:hover, .item-conversacion.activo {
    background: #eef3ff;
  }
  .item-conversacion .nombre { font-weight: 600; }
  .item-conversacion .fecha { font-size: 12px; color: #888; }

  #panel-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .encabezado {
    background: #1f6feb;
    color: white;
    padding: 16px;
    font-weight: 600;
    font-size: 18px;
  }
  .mensajes {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .burbuja {
    max-width: 60%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 15px;
  }
  .burbuja.cliente {
    align-self: flex-start;
    background: #e9e9eb;
    color: #222;
  }
  .burbuja.admin {
    align-self: flex-end;
    background: #1f6feb;
    color: white;
  }
  form {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 10px;
    gap: 8px;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  button {
    background: #1f6feb;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  .vacio {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: #999;
  }
</style>
</head>
<body>

<div id="lista-conversaciones">
  <h2>Conversaciones</h2>
  <div id="lista"></div>
</div>

<div id="panel-chat">
  <div class="encabezado" id="encabezado-chat">Seleccioná una conversación</div>
  <div class="mensajes" id="mensajes"></div>
  <form id="form-mensaje" onsubmit="enviarMensaje(event)" style="display:none;">
    <input type="text" id="input-mensaje" placeholder="Escribí tu respuesta..." autocomplete="off" />
    <button type="submit">Enviar</button>
  </form>
</div>

<script>
  let conversacionActiva = null;
  const divMensajes = document.getElementById("mensajes");
  const divLista = document.getElementById("lista");
  const encabezadoChat = document.getElementById("encabezado-chat");
  const formMensaje = document.getElementById("form-mensaje");

  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket(`${protocolo}//${location.host}/ws/admin`);

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.tipo === "mensaje_nuevo") {
      if (data.session_id === conversacionActiva) {
        agregarBurbuja(data.remitente, data.texto);
      }
      cargarLista(); // refresca por si es una conversación nueva
    }
  };

  function agregarBurbuja(remitente, texto) {
    const burbuja = document.createElement("div");
    burbuja.className = "burbuja " + remitente;
    burbuja.textContent = texto;
    divMensajes.appendChild(burbuja);
    divMensajes.scrollTop = divMensajes.scrollHeight;
  }

  async function cargarLista() {
    const res = await fetch("/api/conversaciones");
    const conversaciones = await res.json();
    divLista.innerHTML = "";
    conversaciones.forEach((c) => {
      const item = document.createElement("div");
      item.className = "item-conversacion" + (c.id === conversacionActiva ? " activo" : "");
      const fecha = new Date(c.creado_en).toLocaleString();
      item.innerHTML = `<div class="nombre">${c.nombre_cliente}</div><div class="fecha">${fecha}</div>`;
      item.onclick = () => abrirConversacion(c.id, c.nombre_cliente);
      divLista.appendChild(item);
    });
  }

  async function abrirConversacion(id, nombre) {
    conversacionActiva = id;
    encabezadoChat.textContent = nombre;
    formMensaje.style.display = "flex";
    divMensajes.innerHTML = "";
    const res = await fetch(`/api/conversaciones/${id}/mensajes`);
    const mensajes = await res.json();
    mensajes.forEach((m) => agregarBurbuja(m.remitente, m.texto));
    cargarLista();
  }

  function enviarMensaje(event) {
    event.preventDefault();
    if (!conversacionActiva) return;
    const input = document.getElementById("input-mensaje");
    const texto = input.value.trim();
    if (!texto) return;
    socket.send(JSON.stringify({ session_id: conversacionActiva, texto: texto }));
    agregarBurbuja("admin", texto);
    input.value = "";
  }

  cargarLista();
  setInterval(cargarLista, 5000); // revisa conversaciones nuevas cada 5 seg
</script>

</body>
</html>
